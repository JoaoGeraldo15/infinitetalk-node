[program:adapter]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/adapter.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
; ⚠️ NÃO use /dev/stdout aqui. Era o que estava configurado até 2026-08-14, e
; `supervisorctl tail adapter` respondia "ERROR (unknown error reading log)" —
; supervisor não consegue LER de volta um log que escreveu num pipe.
;
; /var/log/portal/ é onde a imagem já guarda os logs dos outros serviços
; (wan2gp.log, caddy.log…). Captura tudo, inclusive o output cru do Wan2GP
; (barras de progresso, "New video saved to Path"), que não passa pelo logging
; do Python e por isso não seria pego por um FileHandler.
stdout_logfile=/var/log/portal/adapter.log
redirect_stderr=true
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2

; Espelha o log do adapter para o stdout do container, que é o que o botão LOG
; do Vast mostra.
;
; Escrever em arquivo consertou o `supervisorctl tail`, mas tirou o log do
; painel — e é justamente ANTES de o Jupyter subir, sem terminal nenhum, que
; alguém precisa ver o download dos pesos acontecendo. Com este espelho, os
; dois funcionam.
;
; `tail -F` (maiúsculo) segue o arquivo por nome: sobrevive à rotação dos 50 MB
; e ao arquivo ainda não existir quando este programa inicia.
[program:adapter_log]
command=/bin/sh -c "touch /var/log/portal/adapter.log && exec tail -n +1 -F /var/log/portal/adapter.log"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
