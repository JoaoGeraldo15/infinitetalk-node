[program:adapter]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/adapter.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
; ⚠️ NÃO use /dev/stdout aqui. Era o que estava configurado até 2026-08-14, e
; na primeira sessão real `supervisorctl tail adapter` respondeu
; "ERROR (unknown error reading log)" — supervisor não consegue LER de volta um
; log que ele escreveu num pipe. O log só aparecia no botão LOG do Vast.
;
; /var/log/portal/ é onde a imagem já guarda os logs dos outros serviços
; (wan2gp.log, caddy.log…), então o painel também os mostra.
stdout_logfile=/var/log/portal/adapter.log
redirect_stderr=true
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
