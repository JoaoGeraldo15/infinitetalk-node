[program:adapter]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/adapter.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
; /dev/stdout para o log aparecer no painel do Vast — foi assim que
; descobrimos, na Fase 0b, por que /var/log/portal/wan2gp.log ficava vazio.
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
